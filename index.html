<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Attendly — Personal Attendance</title>
<style>
:root{--bg:#f8fafc;--surface:#fff;--text:#142033;--muted:#64748b;--line:#e2e8f0;--accent:#2783de;--accent-soft:#e8f3ff;--green:#46a171;--green-soft:#e9f7ef;--orange:#d5803b;--orange-soft:#fff2e6;--red:#e56458;--red-soft:#fff0ee;--shadow:0 8px 28px rgba(20,32,51,.06);--radius:16px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:16px;line-height:1.5}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.sidebar{width:238px;background:#fff;border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:10px;padding:0 10px;font-weight:800;letter-spacing:-.03em;font-size:20px}.brand-mark{width:32px;height:32px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:var(--muted);text-align:left;padding:12px 13px;border-radius:11px;display:flex;align-items:center;gap:11px}.nav button:hover,.nav button.active{background:var(--accent-soft);color:#1769b8;font-weight:650}.nav-icon{width:18px;text-align:center}.side-note{margin-top:auto;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:13px;font-size:13px;color:var(--muted)}main{flex:1;min-width:0}.topbar{display:none}.content{max-width:1160px;margin:0 auto;padding:42px 40px 72px}.view{display:none}.view.active{display:block}.eyebrow{color:var(--accent);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:28px}.page-head h1{margin:4px 0 4px;font-size:32px;line-height:1.15;letter-spacing:-.04em}.subtle{color:var(--muted);margin:0}.grid{display:grid;gap:18px}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}.hero{background:linear-gradient(135deg,#fff 0%,#eff7ff 100%);border-color:#d7eaff;padding:28px}.hero h2{margin:8px 0 2px;font-size:38px;letter-spacing:-.05em}.metric-label{color:var(--muted);font-size:14px}.metric{font-weight:780;font-size:28px;letter-spacing:-.04em}.metric small{font-size:15px;font-weight:600;color:var(--muted)}.stat-card{display:flex;align-items:flex-start;justify-content:space-between}.stat-icon{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800}.section-title{font-size:20px;letter-spacing:-.02em;margin:30px 0 14px}.row{display:flex;align-items:center;justify-content:space-between;gap:16px}.stack{display:grid;gap:12px}.actions{display:flex;flex-wrap:wrap;gap:10px}.btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:11px 15px;border-radius:10px;font-weight:700;min-height:44px}.btn:hover{border-color:#b9c7d9;background:#f8fbff}.btn.primary{border-color:var(--accent);background:var(--accent);color:#fff}.btn.primary:hover{background:#1d70c3}.btn.danger{color:var(--red);border-color:#ffd1cc}.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}.btn.small{padding:7px 10px;min-height:36px;font-size:14px}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:5px 10px;font-size:13px;font-weight:700}.pill.good{background:var(--green-soft);color:#27744e}.pill.warn{background:var(--orange-soft);color:#9b541d}.pill.bad{background:var(--red-soft);color:#b54f45}.pill.neutral{background:#f1f5f9;color:#64748b}.progress{height:9px;background:#eaf0f6;border-radius:20px;overflow:hidden;margin:13px 0 8px}.progress>span{display:block;height:100%;background:var(--accent);border-radius:inherit}.classes{display:grid;gap:9px}.class-row,.history-row,.subject-row,.time-row{border:1px solid var(--line);border-radius:12px;padding:14px 15px;background:#fff}.class-row{display:flex;align-items:center;justify-content:space-between;gap:14px}.class-main{display:flex;gap:12px;align-items:center;min-width:0}.number{width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}.class-name{font-weight:750}.class-meta{font-size:13px;color:var(--muted)}.empty{padding:24px;text-align:center;border:1px dashed #cbd5e1;border-radius:13px;color:var(--muted);background:#fbfdff}.notice{padding:13px 15px;border-radius:11px;background:var(--orange-soft);color:#8d551f;border:1px solid #f2d5bd;font-size:14px}.success{padding:15px;border-radius:12px;background:var(--green-soft);color:#2c714e;border:1px solid #c8e8d5}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:grid;gap:6px}.field label{font-size:13px;font-weight:750;color:#475569}.field input,.field select,.field textarea{border:1px solid #cbd5e1;border-radius:10px;padding:11px 12px;background:#fff;color:var(--text);min-height:44px}.field textarea{min-height:110px;resize:vertical}.span-2{grid-column:span 2}.day-tabs{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.day-tab{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;white-space:nowrap;color:var(--muted);font-weight:700}.day-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}.timetable-grid{display:grid;grid-template-columns:repeat(7,minmax(125px,1fr));gap:10px;overflow-x:auto;padding-bottom:8px}.day-column{min-width:125px;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px}.day-column h3{font-size:14px;margin:2px 2px 10px}.time-row{padding:10px;margin-bottom:8px;background:#fff}.time-row strong{display:block;font-size:14px}.time-row small{display:block;color:var(--muted);font-size:12px;margin-top:2px}.table{width:100%;border-collapse:separate;border-spacing:0}.table th,.table td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}.table th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}.table-wrap{overflow:auto}.switch{display:inline-flex;align-items:center;gap:10px}.switch input{appearance:none;width:44px;height:26px;background:#cbd5e1;border-radius:99px;position:relative;cursor:pointer;transition:.15s}.switch input:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0002;transition:.15s}.switch input:checked{background:var(--accent)}.switch input:checked:before{transform:translateX(18px)}.modal-backdrop{position:fixed;inset:0;background:rgba(20,32,51,.38);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal-backdrop.open{display:flex}.modal{background:#fff;border-radius:18px;max-width:580px;width:100%;max-height:90vh;overflow:auto;padding:24px;box-shadow:0 20px 70px rgba(0,0,0,.2)}.modal h2{margin:0 0 7px;letter-spacing:-.03em}.modal-close{float:right;border:0;background:transparent;font-size:24px;color:var(--muted)}.mcq-option{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:9px;cursor:pointer}.mcq-option:hover{border-color:#a9c7e9;background:#f7fbff}.mcq-option input{accent-color:var(--accent);width:18px;height:18px}.footer-note{font-size:13px;color:var(--muted);margin-top:18px}.toast{position:fixed;bottom:22px;right:22px;display:none;background:#142033;color:#fff;padding:12px 16px;border-radius:10px;z-index:20;box-shadow:var(--shadow)}.toast.show{display:block}.danger-text{color:var(--red)}.inline-form{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.inline-form .field{min-width:145px;flex:1}.label-line{font-size:13px;color:var(--muted);margin-bottom:9px}.summary-strip{display:flex;gap:22px;flex-wrap:wrap;margin-top:18px}.summary-strip div{display:grid}.summary-strip strong{font-size:20px}.summary-strip span{font-size:12px;color:var(--muted)}
@media(max-width:800px){.sidebar{display:none}.topbar{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:5}.topbar .brand{padding:0}.mobile-select{border:1px solid var(--line);border-radius:9px;padding:8px;background:#fff;color:var(--text)}.content{padding:28px 16px 48px}.page-head{margin-bottom:20px}.page-head h1{font-size:28px}.grid-3,.grid-2{grid-template-columns:1fr}.hero h2{font-size:34px}.form-grid{grid-template-columns:1fr}.span-2{grid-column:auto}.timetable-grid{grid-template-columns:repeat(7,125px)}.class-row{align-items:flex-start;flex-direction:column}.class-row .actions{width:100%}.class-row .actions .btn{flex:1}.table th,.table td{padding:11px 8px}.table{min-width:680px}}
@media(min-width:801px){.mobile-select{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><div class="brand"><span class="brand-mark">A</span>Attendly</div><nav class="nav" aria-label="Main navigation"><button data-view="home" class="active"><span class="nav-icon">⌂</span>Home</button><button data-view="timetable"><span class="nav-icon">▦</span>Timetable</button><button data-view="history"><span class="nav-icon">↺</span>Attendance History</button><button data-view="settings"><span class="nav-icon">⚙</span>Settings</button></nav><div class="side-note">Private by design.<br/><span id="dbStatus">Browser-only mode</span></div></aside>
<main><header class="topbar"><div class="brand"><span class="brand-mark">A</span>Attendly</div><select class="mobile-select" id="mobileNav" aria-label="Navigate"><option value="home">Home</option><option value="timetable">Timetable</option><option value="history">Attendance History</option><option value="settings">Settings</option></select></header>
<div class="content">
<section id="view-home" class="view active"></section>
<section id="view-timetable" class="view"></section>
<section id="view-history" class="view"></section>
<section id="view-settings" class="view"></section>
</div></main></div>
<div id="modalBackdrop" class="modal-backdrop"><div class="modal" id="modal"></div></div><div id="toast" class="toast"></div>
<script>
const KEY='attendly.v1';
const days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const todayISO=()=>{const d=new Date();const off=d.getTimezoneOffset();return new Date(d.getTime()-off*60000).toISOString().slice(0,10)};
const dateObj=s=>new Date(s+'T12:00:00');
const fmtDate=s=>dateObj(s).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});
const fmtShort=s=>dateObj(s).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
const dayOf=s=>days[(dateObj(s).getDay()+6)%7];
function fresh(){return {subjects:[],timetable:[],records:[],holidays:[],weekendOff:{Saturday:true,Sunday:true},baseline:{date:'',items:[]}}}
let data=load();let currentView='home';let dbMode=location.protocol==='http:'||location.protocol==='https:';
function load(){try{return {...fresh(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return fresh()}}
function save(){localStorage.setItem(KEY,JSON.stringify(data));if(dbMode){fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(()=>setDBStatus('SQLite connected')).catch(()=>setDBStatus('Browser backup'))}}
async function hydrate(){if(!dbMode){setDBStatus('Browser-only mode');return}try{const r=await fetch('/api/state');if(!r.ok)throw Error();const remote=await r.json();data={...fresh(),...remote};localStorage.setItem(KEY,JSON.stringify(data));setDBStatus('SQLite connected');render()}catch{setDBStatus('Browser backup')}}
function setDBStatus(label){const el=document.getElementById('dbStatus');if(el)el.textContent=label}
function pct(a,h){return h?Math.round(a/h*10000)/100:0}
function isAfterBaseline(date){return !data.baseline.date||date>data.baseline.date}
function totals(){let held=0,attended=0;data.baseline.items.forEach(x=>{held+=+x.held||0;attended+=+x.attended||0});data.records.filter(r=>isAfterBaseline(r.date)).forEach(r=>{if(r.status==='attended'){held++;attended++}else if(r.status==='bunked'){held++}});return {held,attended,bunked:held-attended}}
function subjectTotals(){const out={};data.baseline.items.forEach(x=>{out[x.subject]={held:+x.held||0,attended:+x.attended||0}});data.records.filter(r=>isAfterBaseline(r.date)).forEach(r=>{if(!out[r.subject])out[r.subject]={held:0,attended:0};if(r.status!=='cancelled'){out[r.subject].held++;if(r.status==='attended')out[r.subject].attended++}});return out}
function todaysItems(){const iso=todayISO(),day=dayOf(iso);if(data.holidays.some(h=>h.date===iso)||(['Saturday','Sunday'].includes(day)&&data.weekendOff[day]))return [];return data.timetable.filter(x=>x.day===day).sort((a,b)=>(a.time||'').localeCompare(b.time||''))}
function todaysRecord(){return data.records.filter(r=>r.date===todayISO())}
function greet(){const h=new Date().getHours();return h<12?'Good morning':h<18?'Good afternoon':'Good evening'}
function statusPill(s){const map={attended:['Attended','good'],bunked:['Bunked','bad'],cancelled:['Cancelled','neutral'],pending:['Not marked','neutral']};const [t,c]=map[s]||map.pending;return `<span class="pill ${c}">${t}</span>`}
function home(){const t=totals(),p=pct(t.attended,t.held),iso=todayISO(),day=dayOf(iso),holiday=data.holidays.find(h=>h.date===iso),off=(['Saturday','Sunday'].includes(day)&&data.weekendOff[day]);const items=todaysItems(),records=todaysRecord(),submitted=records.length>0;let need75=t.attended/t.held>=.75?0:Math.max(0,Math.ceil((.75*t.held-t.attended)/.25));let need80=t.attended/t.held>=.8?0:Math.max(0,Math.ceil((.8*t.held-t.attended)/.2));const sub=subjectTotals();
return `<div class="page-head"><div><div class="eyebrow">Your daily dashboard</div><h1>${greet()}, Varun</h1><p class="subtle">${fmtDate(iso)} · ${day}</p></div><button class="btn primary" onclick="openAttendance()">Mark today’s attendance</button></div>
<div class="card hero"><div class="row"><div><div class="metric-label">Overall attendance</div><h2>${p.toFixed(2)}%</h2><div class="progress"><span style="width:${Math.min(100,p)}%"></span></div><div class="subtle">${p>=75?'Above':'Below'} the 75% target</div></div><span class="pill ${p>=75?'good':'bad'}">${p>=75?'On track':'Needs attention'}</span></div></div>
<div class="grid grid-3" style="margin-top:18px"><div class="card stat-card"><div><div class="metric-label">Total classes held</div><div class="metric">${t.held}</div></div><div class="stat-icon">Σ</div></div><div class="card stat-card"><div><div class="metric-label">Classes attended</div><div class="metric">${t.attended}</div></div><div class="stat-icon" style="background:var(--green-soft);color:var(--green)">✓</div></div><div class="card stat-card"><div><div class="metric-label">Classes bunked</div><div class="metric">${t.bunked}</div></div><div class="stat-icon" style="background:var(--red-soft);color:var(--red)">×</div></div></div>
<div class="grid grid-2" style="margin-top:18px"><div class="card"><div class="metric-label">Reach 75%</div><div class="metric">${need75}<small>${need75?' classes needed':' · already there'}</small></div><p class="subtle">Attend the next ${need75||0} class${need75===1?'':'es'} without missing one.</p></div><div class="card"><div class="metric-label">Reach 80%</div><div class="metric">${need80}<small>${need80?' classes needed':' · already there'}</small></div><p class="subtle">A simple target to keep in mind.</p></div></div>
<div class="section-title">Today’s classes</div><div class="card">${holiday?`<div class="empty"><strong>College Holiday</strong><br/><span>${holiday.note||'No attendance is counted today.'}</span></div>`:off?`<div class="empty"><strong>College Off Today</strong><br/><span>${day} is marked as an off day in Settings.</span></div>`:!items.length?`<div class="empty"><strong>No classes scheduled today.</strong><br/><span>Add your weekly timetable to start tracking.</span></div>`:`<div class="classes">${items.map((x,i)=>{const r=records.find(a=>a.classId===x.id);return `<div class="class-row"><div class="class-main"><span class="number">${i+1}</span><div><div class="class-name">${esc(x.subject)}</div><div class="class-meta">${x.time?esc(x.time):'Time not set'}${x.teacher?' · '+esc(x.teacher):''}</div></div></div>${r?statusPill(r.status):statusPill('pending')}</div>`}).join('')}</div><div class="actions" style="margin-top:16px"><button class="btn primary" onclick="openAttendance()">${submitted?'Edit today’s attendance':'Mark today’s attendance'}</button></div>`}</div>
<div class="section-title">Subject-wise attendance</div><div class="card">${Object.keys(sub).length?`<div class="classes">${Object.entries(sub).map(([name,v])=>`<div class="row"><div><strong>${esc(name)}</strong><div class="class-meta">${v.attended} attended · ${v.held} held</div></div><span class="pill ${pct(v.attended,v.held)>=75?'good':pct(v.attended,v.held)>=60?'warn':'bad'}">${pct(v.attended,v.held).toFixed(2)}%</span></div>`).join('')}</div>`:`<div class="empty">No subjects yet. Add your timetable or starting attendance in Settings.</div>`}</div>`}
function timetable(){return `<div class="page-head"><div><div class="eyebrow">Weekly schedule</div><h1>Timetable</h1><p class="subtle">Add the classes you want to track each week.</p></div><button class="btn primary" onclick="openClass()">＋ Add class</button></div><div class="card"><div class="label-line">Your week at a glance</div><div class="timetable-grid">${days.map(d=>`<div class="day-column"><h3>${d}${data.weekendOff[d]?' · Off':''}</h3>${data.timetable.filter(x=>x.day===d).sort((a,b)=>(a.time||'').localeCompare(b.time||'')).map(x=>`<div class="time-row"><strong>${esc(x.subject)}</strong><small>${x.time?esc(x.time):'Time not set'}${x.teacher?' · '+esc(x.teacher):''}</small><div class="actions" style="margin-top:8px"><button class="btn small" onclick="openClass('${x.id}')">Edit</button><button class="btn small danger" onclick="deleteClass('${x.id}')">Delete</button></div></div>`).join('')||`<div class="subtle" style="font-size:13px;padding:5px 2px">No classes</div>`}</div>`).join('')}</div></div><div class="section-title">Autofill from plain text</div><div class="card"><p class="subtle">Paste a simple timetable line by line. Attendly will extract the day, time, and subject locally — no API key required.</p><div class="field"><label for="aiText">Example: Monday 9 AM Mathematics, 10 AM Java</label><textarea id="aiText" placeholder="Monday 9 AM Mathematics, 10 AM Java\nTuesday 11 AM Computer Networks"></textarea></div><div class="actions" style="margin-top:12px"><button class="btn" onclick="parseAI()">Preview timetable</button></div><div id="aiPreview"></div></div>`}
function history(){const rows=[...data.records].sort((a,b)=>b.date.localeCompare(a.date));return `<div class="page-head"><div><div class="eyebrow">A simple record</div><h1>Attendance history</h1><p class="subtle">Review or correct anything you’ve already submitted.</p></div><div class="actions"><input class="field" style="padding:10px 12px;border:1px solid var(--line);border-radius:10px" id="historyFilter" placeholder="Filter subject" oninput="renderHistoryTable()" /></div></div><div class="card"><div id="historyTable"></div></div>`}
function renderHistoryTable(){const el=document.getElementById('historyTable');if(!el)return;const q=(document.getElementById('historyFilter')?.value||'').toLowerCase();const rows=data.records.filter(r=>r.subject.toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date));el.innerHTML=rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Subject</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td>${fmtShort(r.date)}</td><td>${esc(r.subject)}</td><td>${statusPill(r.status)}</td><td><div class="actions"><button class="btn small" onclick="editRecord('${r.id}')">Edit</button><button class="btn small danger" onclick="deleteRecord('${r.id}')">Delete</button></div></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No attendance records yet.</div>`}
function settings(){const b=data.baseline.items,t=totals();return `<div class="page-head"><div><div class="eyebrow">Personal preferences</div><h1>Settings</h1><p class="subtle">Keep your baseline and browser data under your control.</p></div></div><div class="grid grid-2"><div class="card"><div class="row"><div><h3 style="margin:0">Weekend settings</h3><p class="subtle">Skip attendance prompts on your days off.</p></div></div><div class="stack" style="margin-top:16px"><label class="switch"><input type="checkbox" ${data.weekendOff.Saturday?'checked':''} onchange="toggleWeekend('Saturday',this.checked)"><span>Saturday off</span></label><label class="switch"><input type="checkbox" ${data.weekendOff.Sunday?'checked':''} onchange="toggleWeekend('Sunday',this.checked)"><span>Sunday off</span></label></div></div><div class="card"><h3 style="margin:0">Start from existing attendance</h3><p class="subtle">Enter the counts your teacher gave you. Percentages alone cannot determine an exact future count.</p><div class="notice" style="margin:14px 0">Starting totals are your baseline. New daily records are added after the baseline date and never replace it.</div><button class="btn primary" onclick="openBaseline()">${b.length?'Edit starting totals':'Set starting totals'}</button></div></div><div class="section-title">Holidays</div><div class="card"><div class="inline-form"><div class="field"><label for="holidayDate">Date</label><input type="date" id="holidayDate"></div><div class="field"><label for="holidayNote">Label</label><input id="holidayNote" placeholder="College holiday"></div><button class="btn" onclick="addHoliday()">Add holiday</button></div>${data.holidays.length?`<div class="classes" style="margin-top:16px">${data.holidays.sort((a,b)=>a.date.localeCompare(b.date)).map(h=>`<div class="row class-row"><div><strong>${fmtShort(h.date)}</strong><div class="class-meta">${esc(h.note||'College holiday')}</div></div><button class="btn small danger" onclick="deleteHoliday('${h.date}')">Remove</button></div>`).join('')}</div>`:''}</div><div class="section-title">Data management</div><div class="card"><p class="subtle">Export a backup before changing devices or clearing your browser.</p><div class="actions"><button class="btn" onclick="exportData()">Export JSON</button><label class="btn" for="importFile">Import JSON</label><input id="importFile" type="file" accept="application/json" hidden onchange="importData(event)"><button class="btn danger" onclick="resetData()">Reset all data</button></div><p class="footer-note">Current baseline: ${t.held} held · ${t.attended} attended · ${pct(t.attended,t.held).toFixed(2)}%</p></div>`}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById('view-'+currentView).classList.add('active');document.getElementById('view-'+currentView).innerHTML={home,timetable,history,settings}[currentView]();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===currentView));document.getElementById('mobileNav').value=currentView;if(currentView==='history')renderHistoryTable()}
function go(v){currentView=v;render()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.view));document.getElementById('mobileNav').onchange=e=>go(e.target.value);
function modal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalBackdrop').classList.add('open')};function closeModal(){document.getElementById('modalBackdrop').classList.remove('open')};document.getElementById('modalBackdrop').onclick=e=>{if(e.target.id==='modalBackdrop')closeModal()};
function openClass(id=''){const x=data.timetable.find(a=>a.id===id)||{day:'Monday',subject:'',time:'',teacher:''};modal(`<button class="modal-close" onclick="closeModal()">×</button><h2>${id?'Edit class':'Add a class'}</h2><p class="subtle">Keep only the details you need each day.</p><form onsubmit="saveClass(event,'${id}')" class="stack" style="margin-top:18px"><div class="form-grid"><div class="field span-2"><label>Subject name</label><input name="subject" required value="${esc(x.subject)}" placeholder="Mathematics"></div><div class="field"><label>Day</label><select name="day">${days.map(d=>`<option ${x.day===d?'selected':''}>${d}</option>`).join('')}</select></div><div class="field"><label>Timing <span class="subtle">(optional)</span></label><input name="time" value="${esc(x.time)}" placeholder="9:00 AM"></div><div class="field span-2"><label>Teacher <span class="subtle">(optional)</span></label><input name="teacher" value="${esc(x.teacher)}" placeholder="Dr. Sharma"></div></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save class</button></div></form>`)}
function saveClass(e,id){e.preventDefault();const f=new FormData(e.target),x={id:id||uid(),subject:f.get('subject').trim(),day:f.get('day'),time:f.get('time').trim(),teacher:f.get('teacher').trim()};if(id)data.timetable=data.timetable.map(a=>a.id===id?x:a);else data.timetable.push(x);if(!data.subjects.includes(x.subject))data.subjects.push(x.subject);save();closeModal();render();toast('Timetable saved')}
function deleteClass(id){if(!confirm('Delete this timetable class?'))return;data.timetable=data.timetable.filter(x=>x.id!==id);save();render();toast('Class deleted')}
function openBaseline(){const items=data.baseline.items;modal(`<button class="modal-close" onclick="closeModal()">×</button><h2>Start from existing attendance</h2><p class="subtle">Enter subject totals exactly as reported. A percentage by itself is not enough for exact calculations.</p><form onsubmit="saveBaseline(event)" class="stack" style="margin-top:18px"><div class="field"><label>Baseline date</label><input type="date" name="date" required value="${data.baseline.date||''}"></div><div id="baselineRows">${items.length?items.map((x,i)=>baselineRow(x,i)).join(''):baselineRow({},0)}</div><button type="button" class="btn" onclick="addBaselineRow()">＋ Add subject</button><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save starting totals</button></div></form>`)}
function baselineRow(x,i){return `<div class="form-grid baseline-row" style="margin-top:12px"><div class="field"><label>Subject</label><input name="sub" required value="${esc(x.subject||'')}" placeholder="Mathematics"></div><div class="field"><label>Held</label><input name="held" type="number" min="0" required value="${x.held??''}"></div><div class="field"><label>Attended</label><input name="att" type="number" min="0" required value="${x.attended??''}"></div><div class="field"><label>Calculated</label><input disabled value="${x.held?pct(x.attended,x.held).toFixed(2)+'%':'—'}"></div></div>`}
function addBaselineRow(){document.getElementById('baselineRows').insertAdjacentHTML('beforeend',baselineRow({},document.querySelectorAll('.baseline-row').length))}
function saveBaseline(e){e.preventDefault();const f=new FormData(e.target),rows=[...document.querySelectorAll('.baseline-row')];const items=rows.map(r=>{const ins=r.querySelectorAll('input');return {subject:ins[0].value.trim(),held:+ins[1].value,attended:+ins[2].value}});if(items.some(x=>x.attended>x.held))return alert('Attended classes cannot exceed held classes.');data.baseline={date:f.get('date'),items};items.forEach(x=>{if(!data.subjects.includes(x.subject))data.subjects.push(x.subject)});save();closeModal();render();toast('Starting totals saved')}
function openAttendance(){const iso=todayISO(),items=todaysItems(),existing=todaysRecord();if(!items.length){toast('There are no classes to mark today');return}modal(`<button class="modal-close" onclick="closeModal()">×</button><h2>${existing.length?'Edit':'Mark'} today’s attendance</h2><p class="subtle">${fmtDate(iso)} · answer once for each scheduled class.</p><form onsubmit="submitAttendance(event)" class="stack" style="margin-top:18px">${items.map(x=>{const r=existing.find(a=>a.classId===x.id);return `<fieldset style="border:0;padding:0;margin:0"><legend><strong>Did you attend ${esc(x.subject)}?</strong>${x.time?` <span class="subtle">· ${esc(x.time)}</span>`:''}</legend><label class="mcq-option"><input type="radio" name="${x.id}" value="attended" ${r?.status==='attended'?'checked':''} required> Attended</label><label class="mcq-option"><input type="radio" name="${x.id}" value="bunked" ${r?.status==='bunked'?'checked':''}> Bunked</label><label class="mcq-option"><input type="radio" name="${x.id}" value="cancelled" ${r?.status==='cancelled'?'checked':''}> Cancelled</label></fieldset>`}).join('')}<div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Submit attendance</button></div></form>`)}
function submitAttendance(e){e.preventDefault();const f=new FormData(e.target),iso=todayISO();if(!isAfterBaseline(iso)){alert('Your starting totals already cover this date. Attendance can be marked from the next day.');return}if(!confirm('Submit today’s attendance? You can edit it later if needed.'))return;data.records=data.records.filter(r=>r.date!==iso);todaysItems().forEach(x=>data.records.push({id:uid(),date:iso,classId:x.id,subject:x.subject,status:f.get(x.id)}));save();closeModal();render();toast('Today’s attendance saved successfully')}
function editRecord(id){const r=data.records.find(x=>x.id===id);if(!r)return;const val=prompt(`Status for ${r.subject}: attended, bunked, or cancelled`,r.status);if(!['attended','bunked','cancelled'].includes(val))return;r.status=val;save();render();toast('Attendance updated')}
function deleteRecord(id){if(!confirm('Delete this attendance entry? Totals will be recalculated.'))return;data.records=data.records.filter(r=>r.id!==id);save();render();toast('Attendance entry deleted')}
function toggleWeekend(day,v){data.weekendOff[day]=v;save();render();toast('Weekend setting updated')}
function addHoliday(){const d=document.getElementById('holidayDate').value,n=document.getElementById('holidayNote').value.trim();if(!d)return alert('Choose a date first.');data.holidays=data.holidays.filter(x=>x.date!==d);data.holidays.push({date:d,note:n||'College holiday'});save();render();toast('Holiday added')}
function deleteHoliday(d){data.holidays=data.holidays.filter(x=>x.date!==d);save();render();toast('Holiday removed')}
function parseAI(){const text=document.getElementById('aiText').value.trim(),out=[];text.split(/\n+/).forEach(line=>{const day=days.find(d=>new RegExp('\\b'+d+'\\b','i').test(line));if(!day)return;const body=line.replace(new RegExp('^.*?\\b'+day+'\\b\\s*','i'),'');body.split(/\s*,\s*/).forEach(part=>{let m=part.match(/^(?:(\d{1,2}(?::\d{2})?\s*(?:AM|PM)?)[ -]*)?(.+?)\s*$/i);if(m&&m[2])out.push({id:uid(),day,time:(m[1]||'').trim(),subject:m[2].trim(),teacher:''})})});const box=document.getElementById('aiPreview');box.innerHTML=out.length?`<div class="success" style="margin-top:16px"><strong>Preview ready</strong><div class="classes" style="margin-top:10px">${out.map(x=>`<div class="row"><span><strong>${x.day}</strong> · ${esc(x.subject)}</span><span class="class-meta">${esc(x.time||'Time not set')}</span></div>`).join('')}</div><button class="btn primary" style="margin-top:14px" onclick='saveParsed(${JSON.stringify(out).replace(/'/g,"&#39;")})'>Add these classes</button></div>`:`<div class="notice" style="margin-top:16px">Couldn’t find a day. Try one line per day, like “Monday 9 AM Mathematics, 10 AM Java”.</div>`}
function saveParsed(out){out.forEach(x=>{data.timetable.push(x);if(!data.subjects.includes(x.subject))data.subjects.push(x.subject)});save();render();toast(`${out.length} classes added`)}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`attendly-backup-${todayISO()}.json`;a.click();URL.revokeObjectURL(a.href)}
function importData(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.timetable||!x.records)throw Error();data={...fresh(),...x};save();render();toast('Backup imported')}catch{alert('That file does not look like an Attendly backup.')}};r.readAsText(file)}
function resetData(){if(!confirm('Are you sure you want to delete all attendance data? This cannot be undone.'))return;data=fresh();save();render();toast('All data reset')}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2400)}
render();hydrate();
</script>
</body></html>
